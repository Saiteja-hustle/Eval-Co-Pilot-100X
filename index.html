<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eval Co-Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --color-primary: #3B3F9E;
    --color-primary-tint: #EEF0FF;
    --color-pass: #1F8A4C;
    --color-fail: #C73A3A;
    --color-text: #1B1D2A;
    --color-text-muted: #6B6F85;
    --color-page-bg: #F4F6FB;
    --color-border: #E1E3F0;
    --radius-card: 12px;
    --radius-control: 8px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--color-page-bg);
    color: var(--color-text);
  }
  .page { max-width: 880px; margin: 0 auto; }
  .site-header { text-align: center; margin-bottom: 28px; }
  .brand {
    font-size: 26px;
    font-weight: 700;
    color: var(--color-primary);
    margin: 0 0 6px;
  }
  .tagline {
    font-size: 14px;
    color: var(--color-text-muted);
    margin: 0;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  .card {
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    box-shadow: 0 1px 2px rgba(27, 29, 42, 0.04), 0 8px 24px rgba(27, 29, 42, 0.05);
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 6px; color: var(--color-text); }
  input[type=text] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--color-text);
    border: 1px solid #CBCEDE;
    border-radius: var(--radius-control);
    background: #fff;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type=text]::placeholder, input[type=password]::placeholder { color: #9A9DB3; }
  input[type=text]:focus, input[type=password]:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(59, 63, 158, 0.18);
  }
  input[type=password] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--color-text);
    border: 1px solid #CBCEDE;
    border-radius: var(--radius-control);
    background: #fff;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .auth-card { max-width: 360px; margin: 0 auto; }
  .auth-actions { display: flex; gap: 10px; margin-top: 14px; }
  .auth-actions button { flex: 1; }
  .auth-error { color: var(--color-fail); font-size: 13px; margin-top: 10px; min-height: 16px; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 880px;
    margin: 0 auto 16px;
    padding: 10px 16px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-control);
    font-size: 13px;
    color: var(--color-text-muted);
  }
  .topbar #userEmailLabel { font-weight: 600; color: var(--color-text); }
  #runIdLine { color: var(--color-text-muted); font-size: 12px; margin-top: 4px; }
  #pastRunsList .past-run-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--color-border);
    font-size: 14px;
  }
  #pastRunsList .past-run-row:last-child { border-bottom: none; }
  .setup-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 20px;
  }
  .row {
    border: 1px solid var(--color-border);
    background: var(--color-primary-tint);
    border-radius: var(--radius-control);
    padding: 14px 16px;
    margin-bottom: 12px;
    position: relative;
  }
  .row .helper { color: var(--color-text-muted); font-size: 12px; margin-top: 4px; }
  .row .delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    color: var(--color-fail);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .row .delete-btn:hover { background: rgba(199, 58, 58, 0.1); }
  button {
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: var(--radius-control);
    border: 1px solid #CBCEDE;
    background: #fff;
    color: var(--color-text);
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
  }
  button:hover { background: #F4F5FC; }
  button.primary {
    background: var(--color-primary);
    color: #fff;
    border-color: var(--color-primary);
    font-weight: 700;
    font-size: 16px;
    padding: 14px 28px;
    width: 100%;
    box-shadow: 0 4px 12px rgba(59, 63, 158, 0.25);
  }
  button.primary:hover:not(:disabled) { background: #32366E; border-color: #32366E; }
  button:disabled { opacity: 0.6; cursor: default; }
  button.primary:disabled { box-shadow: none; }
  .note { color: var(--color-text-muted); font-size: 13px; margin-top: 10px; }
  .status { margin: 16px 0; font-weight: 600; text-align: center; color: var(--color-text-muted); }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; min-width: 560px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--color-border); font-size: 14px; }
  thead th {
    background: var(--color-primary-tint);
    color: var(--color-text);
    font-weight: 600;
    font-size: 13px;
  }
  thead th:first-child { border-top-left-radius: 8px; }
  thead th:last-child { border-top-right-radius: 8px; }
  tr.report-row { cursor: pointer; transition: background-color 0.1s ease; }
  tr.report-row:hover { background: var(--color-primary-tint); }
  .pass, .fail {
    display: inline-block;
    font-weight: 600;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .pass { color: var(--color-pass); background: rgba(31, 138, 76, 0.12); }
  .fail { color: var(--color-fail); background: rgba(199, 58, 58, 0.12); }
  .fixed { color: var(--color-pass); background: rgba(31, 138, 76, 0.12); }
  .broke { color: var(--color-fail); background: rgba(199, 58, 58, 0.12); }
  .same { color: var(--color-text-muted); background: rgba(107, 111, 133, 0.12); }
  .only { color: var(--color-text-muted); background: rgba(107, 111, 133, 0.12); }
  #rerunBtn { display: none; margin: 14px auto 0; }
  .fail-reason-sub { color: var(--color-text-muted); font-size: 12px; margin-top: 2px; }
  #fullAnswer {
    margin-top: 12px;
    background: var(--color-primary-tint);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-control);
    padding: 14px;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #score { font-size: 16px; font-weight: 600; margin-top: 14px; }

  @media (max-width: 600px) {
    .setup-grid { grid-template-columns: 1fr; }
    .card { padding: 16px; }
    button.primary { font-size: 15px; padding: 12px 20px; }
  }
</style>
</head>
<body>
<div class="page">
<header class="site-header">
  <p class="brand">Eval Co-pilot</p>
  <p class="tagline">Test someone else's AI app with your own questions.</p>
</header>

<div class="card auth-card" id="authCard" style="display:none;">
  <label for="authEmail">Email</label>
  <input type="text" id="authEmail" placeholder="you@example.com" autocomplete="username">
  <label for="authPassword">Password</label>
  <input type="password" id="authPassword" placeholder="Your password" autocomplete="current-password">
  <div class="auth-actions">
    <button id="signUpBtn" type="button">Sign up</button>
    <button id="logInBtn" type="button" class="primary" style="width:auto;">Log in</button>
  </div>
  <div class="auth-error" id="authError"></div>
</div>

<div id="appContent" style="display:none;">
<div class="topbar" id="topBar">
  <span>Signed in as <span id="userEmailLabel"></span></span>
  <button id="logOutBtn" type="button">Log out</button>
</div>
<div class="wrap">
  <div class="card">
    <div class="setup-grid">
      <div>
        <label for="appAddress">App address</label>
        <input type="text" id="appAddress" placeholder="https://your-app.example.com/ask">
      </div>
      <div>
        <label for="globalWrongText">If the answer says this, it's wrong</label>
        <input type="text" id="globalWrongText" placeholder="e.g. I don't know">
      </div>
      <div>
        <label for="questionField">Where the question goes (field name)</label>
        <input type="text" id="questionField" value="question">
      </div>
      <div>
        <label for="answerField">Where the answer comes back (field name)</label>
        <input type="text" id="answerField" value="answer">
      </div>
    </div>
  </div>

  <div class="card">
    <div id="rows"></div>
    <button id="addRowBtn">+ Add question</button>
    <div class="note">We recommend 10 questions. Fewer works too.</div>
  </div>

  <button class="primary" id="runBtn">Run</button>
  <div class="status" id="statusMsg"></div>
  <button id="rerunBtn" type="button">Edit questions and run again</button>

  <div class="card" id="reportCard" style="display:none;">
    <div class="table-scroll">
    <table id="reportTable">
      <thead>
        <tr>
          <th>Question</th>
          <th>App's answer</th>
          <th>Pass or Fail</th>
          <th>Why it failed</th>
        </tr>
      </thead>
      <tbody id="reportBody"></tbody>
    </table>
    </div>
    <div id="fullAnswer" style="display:none;"></div>
    <div id="score"></div>
    <div id="runIdLine"></div>
  </div>

  <div class="card" id="compareCard" style="display:none;">
    <div id="compareSummary" class="note" style="margin-top:0;"></div>
    <div class="table-scroll">
    <table id="compareTable">
      <thead>
        <tr>
          <th>Question</th>
          <th>Run 1</th>
          <th>Run 2</th>
          <th>Fixed / Broke / Same</th>
        </tr>
      </thead>
      <tbody id="compareBody"></tbody>
    </table>
    </div>
  </div>

  <div class="card" id="pastRunsCard">
    <label style="margin-top:0;">Your past runs</label>
    <div id="pastRunsList"></div>
  </div>
</div>
</div>
</div>

<script>
const rowsDiv = document.getElementById('rows');
const addRowBtn = document.getElementById('addRowBtn');
const runBtn = document.getElementById('runBtn');
const statusMsg = document.getElementById('statusMsg');
const reportCard = document.getElementById('reportCard');
const reportBody = document.getElementById('reportBody');
const fullAnswerDiv = document.getElementById('fullAnswer');
const scoreDiv = document.getElementById('score');
const rerunBtn = document.getElementById('rerunBtn');
const compareCard = document.getElementById('compareCard');
const compareSummary = document.getElementById('compareSummary');
const compareBody = document.getElementById('compareBody');
const runIdLine = document.getElementById('runIdLine');
const pastRunsList = document.getElementById('pastRunsList');

const authCard = document.getElementById('authCard');
const appContent = document.getElementById('appContent');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const signUpBtn = document.getElementById('signUpBtn');
const logInBtn = document.getElementById('logInBtn');
const authError = document.getElementById('authError');
const userEmailLabel = document.getElementById('userEmailLabel');
const logOutBtn = document.getElementById('logOutBtn');

// Stage 5 page memory: the run just completed, and the run before it
// (set when "Edit questions and run again" is clicked), used to call
// /api/compare once the next run finishes.
let lastRunId = null;
let baseRunId = null;

// Stage 6: Supabase auth. supabaseClient is created once /api/config
// returns the project's URL and publishable key; currentSession holds
// the signed-in user's access token, sent as "Authorization: Bearer ..."
// on every /api call.
let supabaseClient = null;
let currentSession = null;

function authHeaders() {
  return currentSession ? { 'Authorization': `Bearer ${currentSession.access_token}` } : {};
}

function showLoggedOut() {
  authCard.style.display = 'block';
  appContent.style.display = 'none';
}

function showLoggedIn(session) {
  currentSession = session;
  authCard.style.display = 'none';
  appContent.style.display = 'block';
  userEmailLabel.textContent = session.user.email;
  loadPastRuns();
}

async function initAuth() {
  let config;
  try {
    config = await (await fetch('/api/config')).json();
  } catch (err) {
    authError.textContent = 'Could not reach the server.';
    showLoggedOut();
    return;
  }

  if (!config.SUPABASE_URL || !config.SUPABASE_PUBLISHABLE_KEY) {
    authError.textContent = 'The server is not configured for login yet.';
    showLoggedOut();
    return;
  }

  supabaseClient = supabase.createClient(config.SUPABASE_URL, config.SUPABASE_PUBLISHABLE_KEY);

  const { data } = await supabaseClient.auth.getSession();
  if (data.session) {
    showLoggedIn(data.session);
  } else {
    currentSession = null;
    showLoggedOut();
  }

  supabaseClient.auth.onAuthStateChange((_event, session) => {
    if (session) {
      showLoggedIn(session);
    } else {
      currentSession = null;
      showLoggedOut();
    }
  });
}

signUpBtn.addEventListener('click', async () => {
  authError.textContent = '';
  const email = authEmail.value.trim();
  const password = authPassword.value;
  if (!email || !password) {
    authError.textContent = 'Enter an email and a password first.';
    return;
  }
  const { error } = await supabaseClient.auth.signUp({ email, password });
  if (error) {
    authError.textContent = error.message;
  } else {
    authError.textContent = 'Check your email to confirm, or log in if confirmation is off.';
  }
});

logInBtn.addEventListener('click', async () => {
  authError.textContent = '';
  const email = authEmail.value.trim();
  const password = authPassword.value;
  if (!email || !password) {
    authError.textContent = 'Enter an email and a password first.';
    return;
  }
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    authError.textContent = error.message;
  }
});

logOutBtn.addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
});

async function loadPastRuns() {
  try {
    const response = await fetch('/api/runs', { headers: { ...authHeaders() } });
    if (!response.ok) {
      pastRunsList.textContent = 'No runs yet.';
      return;
    }
    const runs = await response.json();
    if (!runs.length) {
      pastRunsList.textContent = 'No runs yet.';
      return;
    }
    pastRunsList.innerHTML = '';
    runs.forEach(r => {
      const row = document.createElement('div');
      row.className = 'past-run-row';
      const date = new Date(r.created_at).toLocaleString();
      row.innerHTML = `<span>${escapeHtml(date)}</span><span>${r.passed} of ${r.total} passed</span>`;
      pastRunsList.appendChild(row);
    });
  } catch (err) {
    pastRunsList.textContent = 'No runs yet.';
  }
}

initAuth();

function addRow() {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <button class="delete-btn" type="button">Delete</button>
    <label>What will your user ask?</label>
    <input type="text" class="questionInput" placeholder="Type the question">
    <label>A good answer includes:</label>
    <input type="text" class="includesInput" placeholder="e.g. 42, warranty, 3 years">
    <div class="helper">Separate with commas. All of them must appear.</div>
  `;
  row.querySelector('.delete-btn').addEventListener('click', () => row.remove());
  rowsDiv.appendChild(row);
}

for (let i = 0; i < 3; i++) addRow();
addRowBtn.addEventListener('click', addRow);

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

runBtn.addEventListener('click', async () => {
  const appAddress = document.getElementById('appAddress').value.trim();
  const questionField = document.getElementById('questionField').value.trim() || 'question';
  const answerField = document.getElementById('answerField').value.trim() || 'answer';
  const globalWrongText = document.getElementById('globalWrongText').value.trim();

  const rowEls = Array.from(rowsDiv.querySelectorAll('.row'));
  const items = rowEls
    .map(row => ({
      row,
      question: row.querySelector('.questionInput').value.trim(),
      includes: row.querySelector('.includesInput').value.trim(),
      questionId: row.dataset.questionId || null,
    }))
    .filter(item => item.question);

  if (items.length === 0) {
    statusMsg.textContent = 'Add at least one question first.';
    return;
  }

  runBtn.disabled = true;
  rerunBtn.style.display = 'none';
  reportCard.style.display = 'none';
  fullAnswerDiv.style.display = 'none';
  compareCard.style.display = 'none';
  reportBody.innerHTML = '';
  scoreDiv.textContent = '';

  let runId = null;
  try {
    const runResponse = await fetch('/api/runs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({
        app_address: appAddress,
        question_field: questionField,
        answer_field: answerField,
        global_wrong_text: globalWrongText,
      }),
    });
    if (runResponse.ok) {
      runId = (await runResponse.json()).id;
    }
  } catch (err) {
    runId = null;
  }

  const results = [];
  const total = items.length;

  for (let i = 0; i < total; i++) {
    statusMsg.textContent = `Running ${i + 1} of ${total}...`;
    const item = items[i];
    let result;
    try {
      const response = await fetch('/api/run-question', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({
          question: item.question,
          app_address: appAddress,
          question_field: questionField,
          answer_field: answerField,
          good_answer_includes: item.includes,
          global_wrong_text: globalWrongText,
          run_id: runId,
          question_id: item.questionId,
        }),
      });
      if (!response.ok) {
        result = { app_answer: '', pass_fail: 'Fail', fail_reason: 'app error' };
      } else {
        result = await response.json();
      }
    } catch (err) {
      result = { app_answer: '', pass_fail: 'Fail', fail_reason: 'app error' };
    }
    if (result.question_id) {
      item.row.dataset.questionId = result.question_id;
    }
    results.push({ question: item.question, ...result });
  }

  statusMsg.textContent = `Done: ${total} of ${total} run.`;
  runBtn.disabled = false;

  let passCount = 0;
  results.forEach((r, idx) => {
    if (r.pass_fail === 'Pass') passCount++;
    const answer = r.app_answer || '';
    const shortAnswer = answer.length > 80 ? answer.slice(0, 80) + '...' : answer;
    const tr = document.createElement('tr');
    tr.className = 'report-row';
    tr.innerHTML = `
      <td>${escapeHtml(r.question)}</td>
      <td>${escapeHtml(shortAnswer)}</td>
      <td class="${r.pass_fail === 'Pass' ? 'pass' : 'fail'}">${escapeHtml(r.pass_fail)}</td>
      <td>${escapeHtml(r.fail_reason || '')}</td>
    `;
    tr.addEventListener('click', () => {
      fullAnswerDiv.style.display = 'block';
      fullAnswerDiv.textContent = answer || '(no answer)';
    });
    reportBody.appendChild(tr);
  });

  scoreDiv.textContent = `${passCount} of ${total} passed`;
  runIdLine.textContent = runId ? `Run id: ${runId}` : '';
  reportCard.style.display = 'block';

  if (runId) {
    rowsDiv.querySelectorAll('.questionInput, .includesInput').forEach(el => {
      el.disabled = true;
    });
    rerunBtn.style.display = 'inline-block';
    loadPastRuns();
    if (baseRunId) {
      await loadCompare(baseRunId, runId);
      baseRunId = null;
    }
    lastRunId = runId;
  }
});

rerunBtn.addEventListener('click', () => {
  rowsDiv.querySelectorAll('.questionInput, .includesInput').forEach(el => {
    el.disabled = false;
  });
  rerunBtn.style.display = 'none';
  baseRunId = lastRunId;
  statusMsg.textContent = 'Edit your questions, then click Run.';
});

async function loadCompare(runA, runB) {
  try {
    const response = await fetch(`/api/compare?run_a=${encodeURIComponent(runA)}&run_b=${encodeURIComponent(runB)}`, {
      headers: { ...authHeaders() },
    });
    if (!response.ok) {
      compareSummary.textContent = 'Could not load the comparison for this rerun.';
      compareBody.innerHTML = '';
      compareCard.style.display = 'block';
      return;
    }
    const data = await response.json();
    renderCompare(data);
  } catch (err) {
    compareSummary.textContent = 'Could not load the comparison for this rerun.';
    compareBody.innerHTML = '';
    compareCard.style.display = 'block';
  }
}

function sideCell(side) {
  if (!side) return '';
  const pillClass = side.pass_fail === 'Pass' ? 'pass' : 'fail';
  let html = `<span class="${pillClass}">${escapeHtml(side.pass_fail)}</span>`;
  if (side.pass_fail === 'Fail' && side.fail_reason) {
    html += `<div class="fail-reason-sub">${escapeHtml(side.fail_reason)}</div>`;
  }
  return html;
}

function statusClass(status) {
  if (status === 'Fixed') return 'fixed';
  if (status === 'Broke') return 'broke';
  if (status === 'Same') return 'same';
  return 'only';
}

function renderCompare(data) {
  const s = data.summary;
  compareSummary.textContent =
    `Run 1: ${s.run_a_score.passed} of ${s.run_a_score.total} passed · ` +
    `Run 2: ${s.run_b_score.passed} of ${s.run_b_score.total} passed · ` +
    `Fixed: ${s.fixed}  Broke: ${s.broke}  Same: ${s.same}`;

  compareBody.innerHTML = '';
  data.rows.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(row.question_text)}</td>
      <td>${sideCell(row.run_a)}</td>
      <td>${sideCell(row.run_b)}</td>
      <td><span class="${statusClass(row.status)}">${escapeHtml(row.status)}</span></td>
    `;
    compareBody.appendChild(tr);
  });

  compareCard.style.display = 'block';
}
</script>
</body>
</html>
